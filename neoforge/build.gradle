plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
    id 'me.modmuss50.mod-publish-plugin'
}

neoForge {
    version = neoforge_version

    validateAccessTransformers = true

    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
        }
        client {
            client()
        }
        clientData {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        serverData {
            serverData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet project(':common').sourceSets.main
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    compileOnly project(":common")
    runtimeOnly("maven.modrinth:architectury-api:EvL9NK2R")
    runtimeOnly("maven.modrinth:yacl:HZs9mrWM")
    runtimeOnly("maven.modrinth:fusion-connected-textures:JB0yd7Es")
    runtimeOnly("maven.modrinth:armor-of-the-ages:qfrUfbaf")
    runtimeOnly("maven.modrinth:dawn-of-time:GcqX19lS")
    runtimeOnly("maven.modrinth:garden-trails:UnPJ9MAf")

    // Biome mods used to test the biome compatibility tags
    runtimeOnly("maven.modrinth:terralith:qcBNpb1U")
    runtimeOnly("maven.modrinth:lithostitched:GXKf1eIb")
    runtimeOnly("maven.modrinth:biomes-o-plenty:cCnnnC72")
    runtimeOnly("maven.modrinth:terrablender:xjrV1Uvq")
    runtimeOnly("maven.modrinth:glitchcore:6dbbrOrO")
    runtimeOnly("maven.modrinth:geckolib:FpONDAt3")
}

publishMods {
    file = jar.archiveFile
    modLoaders.add("neoforge")
}
