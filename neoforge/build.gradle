plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
    id 'me.modmuss50.mod-publish-plugin'
}

neoForge {
    version = neoforge_version

    validateAccessTransformers = true

    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    runs {
        configureEach {
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
        }
        client {
            client()
        }
        clientData {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        serverData {
            serverData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet project(':common').sourceSets.main
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    compileOnly project(":common")
    runtimeOnly("maven.modrinth:architectury-api:fyNzvIcr")
    runtimeOnly("maven.modrinth:yacl:B1mfgQmD")
    runtimeOnly("maven.modrinth:fusion-connected-textures:8g0jpGRQ")
    runtimeOnly("maven.modrinth:armor-of-the-ages:Xqexlxy8")
    runtimeOnly("maven.modrinth:dawn-of-time:JfJLT3xW")
    runtimeOnly("maven.modrinth:garden-trails:IRCjaI3g")

    // Biome mods used to test the biome compatibility tags
    runtimeOnly("maven.modrinth:terralith:4xxRkKvw")
    runtimeOnly("maven.modrinth:lithostitched:pLlJIqyp")
    runtimeOnly("maven.modrinth:biomes-o-plenty:mqkuMsI9")
    runtimeOnly("maven.modrinth:terrablender:cWLGFrxw")
    runtimeOnly("maven.modrinth:glitchcore:mYUbCfgT")
    runtimeOnly("maven.modrinth:geckolib:xfVfPcoC")
}

publishMods {
    file = jar.archiveFile
    modLoaders.add("neoforge")
}
