plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev.legacyforge'
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    validateAccessTransformers = true

    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers = ["src/main/resources/META-INF/accesstransformer.cfg"]
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        client {
            client()
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet project(':common').sourceSets.main
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

repositories {
    maven {
        url = "https://api.modrinth.com/maven"
    }
}

dependencies {
    compileOnly project(":common")
    annotationProcessor("org.spongepowered:mixin:0.8.5-SNAPSHOT:processor")
    modRuntimeOnly("maven.modrinth:architectury-api:1MKTLiiG")
    modRuntimeOnly("maven.modrinth:yacl:3.6.6+1.20.1-forge")
    modRuntimeOnly("maven.modrinth:fusion-connected-textures:w0vXLzFW")
    modRuntimeOnly("maven.modrinth:armor-of-the-ages:Bc9cFnLg")
    modRuntimeOnly("maven.modrinth:dawn-of-time:ULcoAnDs")
    modRuntimeOnly("maven.modrinth:garden-trails:Rz53TZEd")

    // Biome mods used to test the biome compatibility tags (remapped by modRuntimeOnly, unlike run/mods jars)
    // Oh The Biomes We've Gone is excluded on purpose: its dependency Oh The Trees You'll Grow ships mixins without a refmap and crashes the dev environment
    modRuntimeOnly("maven.modrinth:terralith:WeYhEb5d")
    modRuntimeOnly("maven.modrinth:biomes-o-plenty:jxUqRzSD")
    modRuntimeOnly("maven.modrinth:regions-unexplored:XTrgsfIB")
    modRuntimeOnly("maven.modrinth:natures-spirit:ri5j4RHM")
    modRuntimeOnly("maven.modrinth:atmospheric:B9fN8ZSq")
    modRuntimeOnly("maven.modrinth:terrablender:IfcgopfA")
    modRuntimeOnly("maven.modrinth:glitchcore:pYPZ5MNI")
    modRuntimeOnly("maven.modrinth:geckolib:aC5KMoNg")
    modRuntimeOnly("maven.modrinth:blueprint:ZQKDh6gd")
}

jar {
    finalizedBy('reobfJar')
}

publishMods {
    // Point to the reobfuscated JAR produced by a local build.
    // Run "build" (forge > tasks > build > build) BEFORE running publishMods.
    // publishMods will NOT trigger a rebuild, it only uploads the pre-built file.
    file = layout.buildDirectory.file("libs/${mod_id}-forge-${minecraft_version}-${project.version}.jar")
    modLoaders.add("forge")
}
